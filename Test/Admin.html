<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - จัดการข่าวสาร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8f9fc; }
        .sidebar { width: 250px; height: 100vh; background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); color: white; position: fixed; left: 0; top: 0; padding-top: 20px; }
        .sidebar a { display: block; color: rgba(255,255,255,0.8); padding: 15px 20px; text-decoration: none; }
        .sidebar a:hover { color: white; background: rgba(255,255,255,0.1); }
        .main-content { margin-left: 250px; padding: 30px; }
        .news-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .news-img { height: 180px; object-fit: cover; width: 100%; }
        .card-body { padding: 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4 class="text-center mb-4"><i class="fa-solid fa-user-shield"></i> Admin Panel</h4>
        <a href="#" onclick="location.reload()"><i class="fa-solid fa-newspaper"></i> จัดการข่าวสาร</a>
        <a href="ปวช.html" target="_blank"><i class="fa-solid fa-globe"></i> ไปหน้าเว็บไซต์จริง</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>จัดการข่าวสารและกิจกรรม</h2>
        </div>

        <div class="card p-4 mb-4 border-0 shadow-sm">
            <h5 class="mb-3" id="form-header"><i class="fa-solid fa-plus-circle"></i> เพิ่ม/แก้ไข ข่าวสาร</h5>
            <form id="news-form">
                <input type="hidden" id="news-id">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>หัวข้อข่าว</label>
                        <input type="text" id="news-title" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>วันที่</label>
                        <input type="date" id="news-date" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label>เนื้อหาย่อ</label>
                    <input type="text" id="news-excerpt" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>เนื้อหาเต็ม</label>
                    <textarea id="news-fullContent" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label>รูปภาพ</label>
                    <input type="file" id="news-imageFile" class="form-control" accept="image/*">
                    <input type="hidden" id="news-imageUrl">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-save">บันทึกข้อมูล</button>
                <button type="button" class="btn btn-secondary d-none" id="btn-cancel" onclick="resetForm()">ยกเลิก</button>
            </form>
        </div>

        <div class="row" id="admin-news-container">
            </div>
    </div>

    <script>
        const STORAGE_KEY = 'admin_news_data';
        let newsData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // โหลดรูปภาพ
        document.getElementById('news-imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file){
                const reader = new FileReader();
                reader.onload = function(ev) { document.getElementById('news-imageUrl').value = ev.target.result; }
                reader.readAsDataURL(file);
            }
        });

        // บันทึกข้อมูล
        document.getElementById('news-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('news-id').value;
            const newItem = {
                id: id ? id : Date.now().toString(),
                title: document.getElementById('news-title').value,
                date: document.getElementById('news-date').value,
                excerpt: document.getElementById('news-excerpt').value,
                fullContent: document.getElementById('news-fullContent').value,
                imageUrl: document.getElementById('news-imageUrl').value || 'https://via.placeholder.com/400x200'
            };

            if(id) {
                const index = newsData.findIndex(x => x.id === id);
                if(index !== -1) newsData[index] = newItem;
            } else {
                newsData.unshift(newItem);
            }

            saveAndRender();
            resetForm();
            alert('บันทึกสำเร็จ!');
        });

        // ฟังก์ชันลบ (Delete)
        function deleteNews(id) {
            if(confirm('ต้องการลบข่าวนี้ใช่หรือไม่?')) {
                newsData = newsData.filter(item => item.id !== String(id));
                saveAndRender();
            }
        }

        // ฟังก์ชันแก้ไข (Edit)
        function editNews(id) {
            const item = newsData.find(x => x.id === String(id));
            if(item) {
                document.getElementById('news-id').value = item.id;
                document.getElementById('news-title').value = item.title;
                document.getElementById('news-date').value = item.date;
                document.getElementById('news-excerpt').value = item.excerpt;
                document.getElementById('news-fullContent').value = item.fullContent;
                document.getElementById('news-imageUrl').value = item.imageUrl;
                
                document.getElementById('btn-save').innerText = 'อัปเดตข้อมูล';
                document.getElementById('btn-save').classList.replace('btn-primary', 'btn-warning');
                document.getElementById('btn-cancel').classList.remove('d-none');
                window.scrollTo(0,0);
            }
        }

        function saveAndRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newsData));
            renderGrid();
        }

        function resetForm() {
            document.getElementById('news-form').reset();
            document.getElementById('news-id').value = '';
            document.getElementById('news-imageUrl').value = '';
            document.getElementById('btn-save').innerText = 'บันทึกข้อมูล';
            document.getElementById('btn-save').classList.replace('btn-warning', 'btn-primary');
            document.getElementById('btn-cancel').classList.add('d-none');
        }

        function renderGrid() {
            const container = document.getElementById('admin-news-container');
            container.innerHTML = '';
            newsData.forEach(item => {
                container.innerHTML += `
                <div class="col-md-4">
                    <div class="news-card">
                        <img src="${item.imageUrl}" class="news-img">
                        <div class="card-body">
                            <h5>${item.title}</h5>
                            <div class="mt-3 d-flex gap-2">
                                <button onclick="editNews('${item.id}')" class="btn btn-sm btn-warning w-50"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                                <button onclick="deleteNews('${item.id}')" class="btn btn-sm btn-danger w-50"><i class="fa-solid fa-trash"></i> ลบ</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        renderGrid();
    </script>
</body>
</html>
