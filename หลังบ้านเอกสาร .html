<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic-rtc</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="Elecrtonic.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="All/css/bar.css">
    <link rel="stylesheet" href="All/css/button.css">
    <link rel="stylesheet" href="All/css/Elecrtonic.css">
    <link rel="stylesheet" href="All/css/head.css">
    <link rel="stylesheet" href="All/css/news.css">
    <link rel="stylesheet" href="All/css/news1.css">
    <link rel="stylesheet" href="All/css/Sidebar.css">
    <link rel="stylesheet" href="All/css/topbar.css">
    <link rel="stylesheet" href="All/css/โครงสร้างองค์กร.css">
    <link rel="stylesheet" href="All/css/เอกสาร..css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (สำหรับไอคอน) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Animated Grid Background -->
    <div class="grid-bg"></div>
    <div class="gradient-overlay"></div>
    <div class="scanlines"></div>

    <!-- Animated Shapes -->
    <div class="shapes-container">
        <div class="shape shape-circle"></div>
        <div class="shape shape-triangle"></div>
        <div class="shape shape-square"></div>
    </div>

    <!-- Floating Particles -->
    <div id="particles"></div>
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <div class="logo-area">
                    <img src="All/images/โลโก้/logo.png" alt="Ratchaburi Technical College Logo" class="logo-img" />
                    <div class="college-title">
                        <span class="college-name-th">Ratchaburi Technical College</span>
                        <span class="college-name-en">วิทยาลัยเทคนิคราชบุรี</span>
                    </div>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">หน้าหลัก</a></li>
                <li><a href="#features" class="nav-link">ข่าวสาร</a></li>
                <li><a href="#about" class="nav-link">ติดต่อ</a></li>


            </ul>
            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>
    
    <section class="hero" id="home">

        <body class="p-8">

            <div class="max-w-7xl mx-auto">
                <!-- ปุ่มหลัก -->
                <div class="flex justify-end mb-6">
                    <button id="toggle-view-btn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-150 ease-in-out flex items-center">
                        <i class="fas fa-plus mr-2"></i> เพิ่มเอกสารใหม่
                    </button>
                </div>

                <!-- 1. หน้าแสดงเอกสาร (Frontend View) -->
                <div id="document-view" class="space-y-6">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6">📣รายการเอกสารดาวน์โหลด📣</h1>
                    <div id="document-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Document cards will be injected here -->
                    </div>
                </div>

                <!-- 2. หน้าหลังบ้านสำหรับอัปโหลด (Admin View) -->
                <div id="admin-view" class="hidden">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6">ระบบจัดการไฟล์เอกสาร</h1>

                    <!-- Drop Zone Area -->
                    <div id="drop-zone"
                        class="border-4 border-dashed border-gray-300 p-12 rounded-xl text-center cursor-pointer mb-6 h-64 flex flex-col justify-center items-center">
                        <i class="fas fa-cloud-upload-alt text-5xl text-gray-400 mb-4"></i>
                        <p class="text-xl font-semibold text-gray-600">ลากไฟล์ PDF หรือ DOCX มาวางที่นี่</p>
                        <p class="text-sm text-gray-500 mt-1">หรือคลิกเพื่อเลือกไฟล์ (รองรับหลายไฟล์)</p>
                        <input type="file" id="file-input" accept=".pdf,.docx" multiple style="display: none;">
                    </div>

                    <!-- รายการไฟล์ที่ถูกลากมา -->
                    <div id="file-list-area" class="bg-white p-6 rounded-xl shadow-md mb-6">
                        <h3 class="text-xl font-semibold mb-3 text-gray-700">รายการไฟล์ที่เลือก:</h3>
                        <ul id="uploaded-files-list" class="space-y-2 text-gray-600">
                            <!-- Files will be listed here -->
                        </ul>
                    </div>

                    <!-- ปุ่มดำเนินการ -->
                    <div class="flex justify-between items-center">
                        <button id="back-to-doc-btn"
                            class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                            <i class="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก
                        </button>
                        <button id="upload-all-btn"
                            class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-xl transition duration-150 ease-in-out disabled:opacity-50"
                            disabled>
                            <i class="fas fa-upload mr-2"></i> อัปโหลดเอกสารทั้งหมด
                        </button>
                    </div>
                </div>

                <!-- Custom Alert Modal (แทน alert()) -->
                <div id="custom-alert"
                    class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 flex items-center justify-center">
                    <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full text-center">
                        <p id="alert-message" class="text-gray-800 text-lg mb-4"></p>
                        <button id="close-alert-btn"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">ตกลง</button>
                    </div>
                </div>
            </div>
        </body>
        <script src="All/script/เอกสาร.js"></script>

</html>
