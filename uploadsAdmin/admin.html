<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบเพิ่มข่าวสาร (Admin)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        form { border: 1px solid #ddd; padding: 2rem; border-radius: 8px; }
        input, textarea { width: 100%; margin-bottom: 1rem; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>เพิ่มข่าวสารใหม่</h2>
    <!-- สำคัญ: ต้องมี enctype="multipart/form-data" เพื่ออัพโหลดรูป -->
    <form action="save_news.php" method="post" enctype="multipart/form-data">
        
        <label>หัวข้อข่าว:</label>
        <input type="text" name="title" required>

        <label>เลือกรูปภาพ:</label>
        <input type="file" name="news_image" accept="image/*">

        <label>เนื้อหาข่าว:</label>
        <textarea name="content" rows="5"></textarea>

        <button type="submit">บันทึกข้อมูล</button>
    </form>
</body>
</html>
