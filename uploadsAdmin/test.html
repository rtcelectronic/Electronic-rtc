<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าข่าวสาร (Frontend)</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* สไตล์ของการ์ดข่าว */
        .news-card { 
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex;
            gap: 20px;
        }
        .news-img { 
            width: 200px; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 4px; 
            background: #eee;
        }
        .news-content h3 { margin-top: 0; color: #333; }
        .date { color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ข่าวสารล่าสุด</h1>
        <div id="news-container">
            <!-- ข้อมูลจะถูก JS ยัดใส่ตรงนี้ -->
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <script>
        // ฟังก์ชันดึงข้อมูล
        async function fetchNews() {
            try {
                const response = await fetch('get_news.php');
                const data = await response.json();
                
                const container = document.getElementById('news-container');
                container.innerHTML = ''; // เคลียร์ข้อความ "กำลังโหลด..."

                if (data.length === 0) {
                    container.innerHTML = '<p>ยังไม่มีข่าวสาร</p>';
                    return;
                }

                // วนลูปสร้าง HTML สำหรับแต่ละข่าว
                data.forEach(news => {
                    // ตรวจสอบว่ามีรูปไหม ถ้าไม่มีใช้รูป Placeholder
                    const imageUrl = news.image_path ? news.image_path : '[https://placehold.co/200x150?text=No+Image](https://placehold.co/200x150?text=No+Image)';

                    const html = `
                        <div class="news-card">
                            <img src="${imageUrl}" class="news-img" alt="รูปประกอบข่าว">
                            <div class="news-content">
                                <h3>${news.title}</h3>
                                <p class="date">ลงเมื่อ: ${news.created_at}</p>
                                <p>${news.content}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('news-container').innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
            }
        }

        // เรียกทำงานทันทีเมื่อเปิดเว็บ
        fetchNews();
    </script>
</body>
</html>
